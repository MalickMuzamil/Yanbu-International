<div class="d-md-none p-3">
  <button
    class="btn btn-outline-dark bg-white"
    type="bchterm: stringutton"
    data-bs-toggle="offcanvas"
    data-bs-target="#sidebarOffcanvas"
  >
    <i class="bx bx-menu fs-4 text-dark"></i>
  </button>
</div>

<div class="d-flex" style="height: 100vh; overflow: hidden">
  <app-sidebar
    style="position: sticky; top: 0; height: 100vh; flex-shrink: 0"
  ></app-sidebar>

  <div
    class="flex-grow-1 p-4 d-flex flex-column w-100 page"
    style="overflow-y: auto; height: 100vh"
  >
    <h2 class="mb-4 title fw-bold">Single Jobs</h2>

    <div class="mb-4 row align-items-start filter-bar">
      <div class="col-12 col-md-12 col-lg-12">
        <div class="d-flex flex-column">
          <div class="input-group search-box">
            <span class="input-group-text bg-white">
              <i class="bx bx-search"></i>
            </span>
            <input
              type="text"
              class="form-control search-input"
              placeholder="Search Jobs created by this Company...."
              (input)="onSearchChange()"
              [(ngModel)]="searchTerm"
            />
          </div>

          <small class="text-muted mt-1 ms-1"
            >Press <strong>Enter</strong> to search</small
          >
        </div>
      </div>
    </div>

    <div class="table-responsive">
      <table
        class="table table-hover table-striped table-bordered shadow-sm rounded-3"
      >
        <thead class="table-primary">
          <tr>
            <th class="py-3">Job Title</th>
            <th class="py-3">Location</th>
            <th class="py-3">Salary</th>
            <th class="py-3">Posted Date</th>
            <th class="py-3">Experience</th>
            <th class="py-3">Description</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let job of filteredJobs">
            <td class="fw-semibold text-dark">{{ job.title }}</td>
            <td>{{ job.location }}</td>
            <td>{{ job.salary }}</td>
            <td>{{ job.jobPostedDate | date : "yyyy-MM-dd" }}</td>
            <td>{{ job.experience }}</td>
            <td class="text-truncate" style="max-width: 250px">
              {{ job.description }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      (pageChange)="onPageChange($event)"
    ></app-pagination>
  </div>
</div>
