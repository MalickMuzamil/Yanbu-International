<div class="d-flex" style="height: 100vh; overflow: hidden">
 <button class="btn btn-primary d-md-none" 
        type="button" 
        data-bs-toggle="offcanvas" 
        data-bs-target="#sidebarOffcanvas" 
        aria-controls="sidebarOffcanvas"
        style="position: absolute; top: 10px; right: 10px; z-index: 1000;">
  ☰
</button>


  <app-candidate-sidebar
    *ngIf="!isCollapsed"
    style="position: sticky; top: 0; height: 100vh; flex-shrink: 0"
  ></app-candidate-sidebar>

  <div class="flex-grow-1 p-4 d-flex flex-column w-100 page">
    <h2 class="mb-4 title fw-bold">Applied Jobs</h2>

    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Job Title</th>
            <th>Candidate Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Applied At</th>
            <th>Resume</th>
            <th>View Job</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let job of appliedJobs; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ job.jobTitle }}</td>
            <td>{{ job.candidateName }}</td>
            <td>{{ job.email }}</td>
            <td>
              <span class="badge bg-primary">{{ job.status }}</span>
            </td>
            <td>{{ job.appliedAt | date : "medium" }}</td>
            <td>
              <a
                [href]="job.resume"
                target="_blank"
                class="btn btn-sm btn-outline-primary"
                >Download</a
              >
            </td>
            <td>
              <a
                [routerLink]="['/job', job.jobId]"
                class="btn btn-sm btn-outline-success"
              >
                View
              </a>
            </td>
          </tr>
          <tr *ngIf="appliedJobs.length === 0">
            <td colspan="7" class="text-center">No jobs applied yet.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-3 d-flex justify-content-end">
      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="onPageChange($event)"
      ></app-pagination>
    </div>
  </div>
</div>

<app-dailog-box
  [visible]="showConfirmDialog"
  [title]="'Confirm Registration'"
  [message]="'Are you sure you want to confirm registration for ' + '?'"
  [confirmText]="'Confirm'"
  [cancelText]="'Cancel'"
>
</app-dailog-box>
