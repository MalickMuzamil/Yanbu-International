<div
  *ngIf="showTemplates"
  class="template-modal d-flex justify-content-center align-items-center"
>
  <div class="template-modal-content p-4 rounded shadow-lg">
    <h4 class="text-center fw-bold mb-4">Choose a CV Template</h4>

    <div class="row g-3">
      <div class="col-12 col-md-4" *ngFor="let template of [1,2,3]">
        <div class="template-card text-center p-3 rounded-3" (click)="applyTemplate(template)">
          <div class="mb-2 fw-bold">Template {{ template }}</div>
          <div class="template-preview d-flex align-items-center justify-content-center">
            Preview
          </div>
        </div>
      </div>
    </div>

    <div class="text-end mt-4">
      <button class="btn btn-outline-secondary btn-sm" (click)="onClose()">Close</button>
    </div>
  </div>
</div>
