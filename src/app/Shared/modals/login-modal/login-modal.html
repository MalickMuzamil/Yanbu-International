@if (isOpen) {
<div class="modal-backdrop fade show"></div>
}

@if (isOpen) {
<div class="modal fade show d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg rounded-3">

            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold">🔐 Admin Login</h5>
                <button type="button" class="btn-close" (click)="close()"></button>
            </div>

            <div class="modal-body">
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" formControlName="email" placeholder="Enter your email">
                        <div class="text-danger small mt-1"
                            *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
                            Valid email is required.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" formControlName="password"
                            placeholder="Enter your password">
                        <div class="text-danger small mt-1"
                            *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                            Password must be at least 6 characters.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-danger w-100 fw-bold">Login</button>
                </form>
            </div>

        </div>
    </div>
</div>
}
